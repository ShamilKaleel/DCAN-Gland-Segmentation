model: dcan
seed: 42
device: cuda

# Data
data_dir: data
train_split: data/splits/fixed_train.txt
val_split: data/splits/fixed_val.txt

# Architecture
output_stride: 8        # 8 = DeepLab-LargeFOV atrous backbone (HPC). 32 = legacy 2GB backbone.

# Training (HPC: RTX 5090 32GB)
crop_size: 480
batch_size: 8           # 32GB allows a real batch; raise if VRAM permits
num_workers: 16         # i9-14900K has 32 threads
crops_per_image: 4
max_epochs: 100
pretrained: true
accum_steps: 1          # no accumulation needed with a real batch
freeze_encoder_bn: false # real BatchNorm trains fine at batch >= 8
eval_every: 5           # run val-Dice checkpoint selection every N epochs

# Class weighting (capped inverse-frequency; uncapped contour weight over-splits glands)
obj_weight_cap: 10.0
cnt_weight_cap: 5.0

# Optimizer
lr: 0.001
momentum: 0.9
weight_decay: 0.0005
lr_patience: 10
min_lr: 0.0000001

# Deep supervision
w_a_init: 1.0
w_a_decay: 0.1
w_a_step: 10000
w_a_min: 0.001

# Contour
contour_radius: 3

# Inference
infer_stride: 240
t_o: 0.5
t_c: 0.5
smooth_radius: 3
min_area: 120

# Output
run_dir: runs/dcan
